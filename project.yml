name: StreamChatAIDemo
options:
  bundleIdPrefix: com.davidpovarsky
  deploymentTarget:
    iOS: "27.0"
packages:
  AgentChatSDK:
    path: Packages/AgentChatSDK
targets:
  StreamChatAIDemo:
    type: application
    platform: iOS
    sources:
      - StreamChatAIDemo
    dependencies:
      - package: AgentChatSDK
        product: AgentChatSDK
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davidpovarsky.AgentChatDemo
        PRODUCT_NAME: AgentChat Demo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AgentChat Demo
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Voice input for the AI chat composer.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Convert speech to text in the AI chat composer.
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
