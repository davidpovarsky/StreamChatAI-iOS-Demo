name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      record_snapshots:
        description: 'Record snapshot baselines'
        required: false
        default: false
        type: boolean
  push:
    branches: [main, agent/swiftchat-sdk-chatgpt-stack-realignment]

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode & Print Environment Info
        run: |
          set -euo pipefail
          XCODE=$(find /Applications -maxdepth 1 -type d -name 'Xcode_27*.app' -print | sort | tail -1)
          if [ -z "$XCODE" ]; then
            echo "Xcode 27 not found in /Applications. Available Xcodes:"
            ls -1 /Applications | grep '^Xcode' || true
            XCODE=$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort | tail -1)
          fi
          echo "Selected Xcode: $XCODE"
          if [ -n "$XCODE" ]; then
            echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
            export DEVELOPER_DIR="$XCODE/Contents/Developer"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version || true
          swift --version
          uname -a

      - name: Build AgentChatSDK Package Targets
        run: |
          set -euo pipefail
          cd Packages/AgentChatSDK
          xcodebuild -scheme AgentChatSDK -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          xcodebuild -scheme AgentChatVoiceLiveKit -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          xcodebuild -scheme AgentChatWebContent -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Run AgentChatSDK & Math Comparison Tests
        run: |
          set -euo pipefail
          cd Packages/AgentChatSDK
          SIM_ID=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          echo "Using simulator ID: $SIM_ID"
          if [ "${{ inputs.record_snapshots }}" = "true" ]; then
            echo "Recording snapshots via -test-env SNAPSHOT_TESTING_RECORD=all"
            export SNAPSHOT_TESTING_RECORD=all
            xcodebuild test -scheme AgentChatSDK-Package -destination "platform=iOS Simulator,id=$SIM_ID" -test-env SNAPSHOT_TESTING_RECORD=all -test-env SNAPSHOT_RECORD=all CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO || true
          else
            xcodebuild test -scheme AgentChatSDK-Package -destination "platform=iOS Simulator,id=$SIM_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          fi

      - name: Upload Snapshot Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Snapshots-IPA
          path: |
            Packages/AgentChatSDK/Tests/**/__Snapshots__
            /Users/runner/Library/Developer/CoreSimulator/Devices/*/data/tmp/**
          if-no-files-found: ignore

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project StreamChatAIDemo.xcodeproj -scheme StreamChatAIDemo

      - name: Build for iOS device
        run: |
          set -euo pipefail
          xcodebuild -project StreamChatAIDemo.xcodeproj -scheme StreamChatAIDemo -configuration Release -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tee build.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP=$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)
          test -n "$APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry AgentChatSDK-Native-Demo-unsigned.ipa Payload
          cp AgentChatSDK-Native-Demo-unsigned.ipa SwiftChat-AgentSDK-Demo-unsigned.ipa
          cp AgentChatSDK-Native-Demo-unsigned.ipa StreamChatAI-Demo-unsigned.ipa
          ls -lh AgentChatSDK-Native-Demo-unsigned.ipa

      - name: Upload AgentChatSDK-Native-Demo-IPA
        uses: actions/upload-artifact@v4
        with:
          name: AgentChatSDK-Native-Demo-IPA
          path: AgentChatSDK-Native-Demo-unsigned.ipa
          if-no-files-found: error

      - name: Upload SwiftChat-AgentSDK-Demo-IPA
        uses: actions/upload-artifact@v4
        with:
          name: SwiftChat-AgentSDK-Demo-IPA
          path: SwiftChat-AgentSDK-Demo-unsigned.ipa
          if-no-files-found: error

      - name: Upload StreamChatAI-Demo-IPA
        uses: actions/upload-artifact@v4
        with:
          name: StreamChatAI-Demo-IPA
          path: StreamChatAI-Demo-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
