name: Build Open Relay Offline Demo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - uses: actions/checkout@v4

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Select newest Xcode with Swift 6.3+
        run: |
          XCODE=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "No Xcode 26 found"
            ls -1 /Applications | grep '^Xcode'
            exit 1
          fi
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          "$XCODE/Contents/Developer/usr/bin/xcodebuild" -version
          SWIFT_VER=$("$XCODE/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/swiftc" --version | head -1)
          echo "$SWIFT_VER"
          case "$SWIFT_VER" in
            *"Swift version 6.3"*|*"Swift version 6.4"*|*"Swift version 7."*) ;;
            *)
              echo "Selected Xcode does not provide Swift 6.3+"
              exit 1
              ;;
          esac

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Clone Open Relay
        run: |
          mkdir -p upstream
          git clone --depth 1 https://github.com/Ichigo3766/Open-Relay.git upstream/Open-Relay

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Patch offline demo mode
        run: python3 scripts/patch_openrelay_offline_demo.py

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Resolve packages
        run: |
          cd upstream/Open-Relay
          xcodebuild -resolvePackageDependencies -project "Open UI.xcodeproj" -scheme "Open UI"

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          cd upstream/Open-Relay
          xcodebuild \
            -project "Open UI.xcodeproj" \
            -scheme "Open UI" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee ../../openrelay-build.log

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Package unsigned IPA
        run: |
          APP=$(find upstream/Open-Relay/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          rm -rf "$APP/PlugIns" "$APP/Watch" "$APP/Frameworks/OpenRelayWatch.framework" || true
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry OpenRelay-Offline-Demo-unsigned.ipa Payload

      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: OpenRelay-Offline-Demo-IPA
          path: OpenRelay-Offline-Demo-unsigned.ipa
          if-no-files-found: error

      - name: Live Activity · refresh
        if: failure()
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openrelay-build-log
          path: openrelay-build.log
          if-no-files-found: ignore
