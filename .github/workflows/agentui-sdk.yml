name: AgentUI SDK & Showcase

on:
  workflow_dispatch:
  push:
    branches:
      - agent/agentui-sdk-hardening-v2
      - agent/agentui-sdk
      - main
  pull_request:
    branches:
      - main

jobs:
  package:
    name: Package Build & Tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(find /Applications -maxdepth 1 -type d \( -name 'Xcode_26*.app' -o -name 'Xcode_16*.app' \) -print | sort | tail -1)
          if [ -z "$XCODE" ]; then
            echo "Custom Xcode not found, using default Xcode"
          else
            echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          fi
          xcodebuild -version

      - name: SwiftPM Build
        run: swift build -v

      - name: SwiftPM Test
        run: swift test -v

  showcase:
    name: Showcase Device Build & Package IPA
    runs-on: macos-15
    timeout-minutes: 45
    needs: package
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(find /Applications -maxdepth 1 -type d \( -name 'Xcode_26*.app' -o -name 'Xcode_16*.app' \) -print | sort | tail -1)
          if [ -z "$XCODE" ]; then
            echo "Custom Xcode not found, using default Xcode"
          else
            echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          fi
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Showcase Xcode Project
        run: |
          cd Showcase
          xcodegen generate

      - name: Build Showcase App (device)
        run: |
          set -o pipefail
          cd Showcase
          xcodebuild \
            -project AgentUIShowcase.xcodeproj \
            -scheme AgentUIShowcase \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee ../showcase-build.log

      - name: Report Build Errors on Failure
        if: failure()
        run: |
          grep -E 'error:|warning:' showcase-build.log | tail -100 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Package Unsigned IPA
        run: |
          APP=$(find Showcase/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry AgentUI-Showcase-unsigned.ipa Payload

      - name: Upload Showcase IPA
        uses: actions/upload-artifact@v4
        with:
          name: AgentUI-Showcase-IPA
          path: AgentUI-Showcase-unsigned.ipa

      - name: Discover Available Simulators
        id: simulators
        run: |
          IPHONE_SIM=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | sed -E 's/.* \(([0-9A-F-]+)\).*/\1/')
          IPAD_SIM=$(xcrun simctl list devices available | grep -E "iPad" | head -1 | sed -E 's/.* \(([0-9A-F-]+)\).*/\1/')
          
          if [ -z "$IPHONE_SIM" ]; then
            echo "::error::No available iPhone simulator found"
            exit 1
          fi
          if [ -z "$IPAD_SIM" ]; then
            echo "::error::No available iPad simulator found"
            exit 1
          fi
          
          echo "iphone_id=$IPHONE_SIM" >> "$GITHUB_OUTPUT"
          echo "ipad_id=$IPAD_SIM" >> "$GITHUB_OUTPUT"
          echo "Selected iPhone Simulator: $IPHONE_SIM"
          echo "Selected iPad Simulator: $IPAD_SIM"

      - name: Run Showcase iPhone UI Tests
        run: |
          set -o pipefail
          cd Showcase
          xcodebuild \
            -project AgentUIShowcase.xcodeproj \
            -scheme AgentUIShowcaseUITests \
            -destination "id=${{ steps.simulators.outputs.iphone_id }}" \
            -derivedDataPath DerivedData \
            -resultBundlePath DerivedData/iPhone-UITests.xcresult \
            test

      - name: Run Showcase iPad UI Tests
        run: |
          set -o pipefail
          cd Showcase
          xcodebuild \
            -project AgentUIShowcase.xcodeproj \
            -scheme AgentUIShowcaseUITests \
            -destination "id=${{ steps.simulators.outputs.ipad_id }}" \
            -derivedDataPath DerivedData \
            -resultBundlePath DerivedData/iPad-UITests.xcresult \
            test

      - name: Upload UI Test Result Bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AgentUI-UITest-Results
          path: |
            Showcase/DerivedData/iPhone-UITests.xcresult
            Showcase/DerivedData/iPad-UITests.xcresult
